<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">

    <div class="row justify-content-center">


        <div class="col-md-6">


            <div class="card shadow p-4">


                <h2 class="text-center mb-4">
                    Create Account
                </h2>



                <form id="registerForm">


                    <div class="mb-3">

                        <input 
                        type="text"
                        class="form-control"
                        id="first_name"
                        placeholder="First Name"
                        required>

                    </div>



                    <div class="mb-3">

                        <input 
                        type="text"
                        class="form-control"
                        id="last_name"
                        placeholder="Last Name"
                        required>

                    </div>




                    <div class="mb-3">

                        <input 
                        type="text"
                        class="form-control"
                        id="username"
                        placeholder="Username"
                        required>

                    </div>




                    <div class="mb-3">

                        <input 
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Email"
                        required>

                    </div>




                    <div class="mb-3">

                        <input 
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Password"
                        required>

                    </div>




                    <div class="mb-3">

                        <input 
                        type="password"
                        class="form-control"
                        id="confirm_password"
                        placeholder="Confirm Password"
                        required>

                    </div>




                    <button 
                    type="submit"
                    class="btn btn-primary w-100">

                        Register

                    </button>



                </form>



                <p class="text-center mt-3">

                    Already have an account?

                    <a href="/login/">
                        Login
                    </a>

                </p>



            </div>


        </div>


    </div>


</div>



<script src="/static/js/register.js"></script>


</body>

</html>
