{% extends "admin_dashboard/admin_base.html" %}
{% load static %}
{% block title %}
Add Cake
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">
                Add New Cake
            </h2>

            <p class="text-muted">
                Fill in the details below to add a new cake.
            </p>

        </div>

        <a href="{% url 'cake_list' %}" class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left"></i>

            Back

        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <form id="cakeForm" enctype="multipart/form-data">

                <div class="row">

                    <!-- Cake Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Cake Name

                        </label>

                        <input

                            type="text"

                            id="name"

                            class="form-control"

                            placeholder="Enter Cake Name">

                    </div>

                    <!-- Category -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Category

                        </label>

                        <select

                            id="category"

                            class="form-select">

                            <option value="">

                                Select Category

                            </option>

                        </select>

                    </div>

                    <!-- Price -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Price

                        </label>

                        <input

                            type="number"

                            id="price"

                            class="form-control"

                            placeholder="Price">

                    </div>

                    <!-- Weight -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Weight

                        </label>

                        <input

                            type="text"

                            id="weight"

                            class="form-control"

                            placeholder="500 gm / 1 KG">

                    </div>

                    <!-- Status -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Status

                        </label>

                        <select

                            id="status"

                            class="form-select">

                            <option value="available">

                                Available

                            </option>

                            <option value="out_of_stock">

                                Out Of Stock

                            </option>

                        </select>

                    </div>

                    <!-- Image -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Cake Image

                        </label>

                        <input

                            type="file"

                            id="image"

                            class="form-control"

                            accept="image/*">

                    </div>

                    <!-- Description -->

                    <div class="col-12 mb-3">

                        <label class="form-label">

                            Description

                        </label>

                        <textarea

                            id="description"

                            rows="5"

                            class="form-control"

                            placeholder="Cake Description"></textarea>

                    </div>

                </div>

                <!-- Image Preview -->

                <div class="text-center mb-4">

                    <img

                        id="preview"

                        src="{% static 'images/no-image.png' %}"

                        class="img-thumbnail"

                        style="width:220px;height:220px;object-fit:cover;">

                </div>

                <!-- Buttons -->

                <div class="text-end">

                    <button

                        type="reset"

                        class="btn btn-secondary">

                        Reset

                    </button>

                    <button

                        type="submit"

                        class="btn btn-main">

                        <i class="bi bi-check-circle"></i>

                        Save Cake

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script src="{% static 'js/cake_add.js' %}"></script>


{% endblock %}
