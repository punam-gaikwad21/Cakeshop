{% extends "admin_dashboard/admin_base.html" %}
{% load static %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-header">

            <h3>Order Details</h3>

        </div>

        <div class="card-body">

            <div class="row mb-4">

                <div class="col-md-6">

                    <h5>
                        Order No :
                        <span id="orderNumber"></span>
                    </h5>

                    <h5>
                        Customer :
                        <span id="customerName"></span>
                    </h5>

                </div>

                <div class="col-md-6 text-end">

                    <h5>
                        Payment :
                        <span id="paymentStatus"></span>
                    </h5>

                    <h5>
                        Status :
                        <span id="orderStatus"></span>
                    </h5>

                </div>

            </div>

            <div class="table-responsive">

                <table class="table table-bordered">

                    <thead>

                        <tr>

                            <th>Cake</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Subtotal</th>

                        </tr>

                    </thead>

                    <tbody id="itemTable">

                    </tbody>

                </table>

            </div>

            <div class="text-end mt-4">

                <h4>

                    Total :

                    ₹<span id="totalAmount"></span>

                </h4>

            </div>

        </div>

    </div>

</div>


<script src="{% static 'js/order_details.js' %}"></script>

{% endblock %}
