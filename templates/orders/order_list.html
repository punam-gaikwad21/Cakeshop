{% extends "admin_dashboard/admin_base.html" %}
{% load static %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">


<h2 class="fw-bold">
    Order Management
</h2>


</div>

<div class="card shadow-sm border-0">


<div class="card-body">

    <!-- Search -->
    <div class="row mb-3">

        <div class="col-md-4">

            <input
                type="text"
                id="search"
                class="form-control"
                placeholder="Search Order">

        </div>

    </div>


    <!-- Orders Table -->
    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead>

                <tr>

                    <th>Order No</th>
                    <th>Customer</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="orderTable">

            </tbody>

        </table>

    </div>

</div>


</div>


<script src="{% static 'js/order_list.js' %}"></script>

{% endblock %}
