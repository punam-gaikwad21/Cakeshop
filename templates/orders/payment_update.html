{% extends "admin_dashboard/admin_base.html" %}
{% load static %}

{% block content %}

<div class="card shadow-sm border-0">

```
<div class="card-header">
    <h3>Update Payment Status</h3>
</div>

<div class="card-body">

    <form id="paymentStatusForm">

        <div class="mb-3">

            <label class="form-label">
                Payment Status
            </label>

            <select
                id="paymentStatus"
                class="form-select">

                <option value="pending">
                    Pending
                </option>

                <option value="paid">
                    Paid
                </option>

                <option value="failed">
                    Failed
                </option>

            </select>

        </div>

        <button
            type="submit"
            class="btn btn-main">

            Update Payment

        </button>

    </form>

</div>
```

</div>


<script src="{% static 'js/payment_update.js' %}"></script>

{% endblock %}
